name: Build and publish Grafana

on:
  push:
    branches: [main, master]
    paths:
      - docker/grafana/**
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - docker/grafana/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grafana-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image repository
        env:
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: test -n "$IMAGE_REPOSITORY"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/grafana
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:13.2.2
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
